<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GameVault | Tambah Review</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>GameVault</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../game/list.html">Daftar Game</a></li>
                <li><a href="../game/tambah.html">Tambah Game</a></li>
                <li><a href="list.html">Daftar Review</a></li>
                <li><a href="tambah.html">Tambah Review</a></li>
            </ul>
        </nav>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
    </header>

    <main>
        <section>
            <h2>Tambah Review</h2>

            <form id="form-tambah" novalidate>
                <div class="form-grup">
                    <label for="review-game">Game</label>
                    <select id="review-game" name="gameId">
                        <option value="" disabled selected>-- Pilih Game --</option>
                    </select>
                </div>

                <div class="form-grup">
                    <label for="penulis">Nama Penulis</label>
                    <input type="text" id="penulis" name="penulis">
                </div>

                <div class="form-grup">
                    <label for="rating">Rating (1-5)</label>
                    <input type="number" id="rating" name="rating" min="1" max="5" step="0.5">
                </div>

                <div class="form-grup">
                    <label for="komentar">Komentar</label>
                    <textarea id="komentar" name="komentar" rows="4"></textarea>
                </div>

                <div class="form-grup">
                    <button type="submit" class="btn-utama">Simpan</button>
                    <a class="btn-tutup" href="list.html">Batal</a>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 GameVault &mdash; ZhayaGTs</p>
    </footer>

    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/review.js"></script>
</body>
</html>
