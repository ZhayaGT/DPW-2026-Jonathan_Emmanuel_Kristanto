<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GameVault | Tambah Game</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>GameVault</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html">Daftar Game</a></li>
                <li><a href="tambah.html">Tambah Game</a></li>
                <li><a href="../review/list.html">Daftar Review</a></li>
                <li><a href="../review/tambah.html">Tambah Review</a></li>
            </ul>
        </nav>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
    </header>

    <main>
        <section>
            <h2 id="judul-halaman">Tambah Game</h2>

            <form id="form-tambah" novalidate>
                <div class="form-grup">
                    <label for="judul">Judul Game</label>
                    <input type="text" id="judul" name="judul">
                </div>

                <div class="form-grup">
                    <label for="developer">Developer</label>
                    <input type="text" id="developer" name="developer">
                </div>

                <div class="form-grup">
                    <label for="genre">Genre</label>
                    <select id="genre" name="genre">
                        <option value="" disabled selected>-- Pilih Genre --</option>
                        <option value="RPG">RPG</option>
                        <option value="FPS">FPS</option>
                        <option value="MOBA">MOBA</option>
                        <option value="Adventure">Adventure</option>
                        <option value="Strategy">Strategy</option>
                        <option value="Indie">Indie</option>
                    </select>
                </div>

                <div class="form-grup">
                    <label for="platform">Platform</label>
                    <select id="platform" name="platform">
                        <option value="" disabled selected>-- Pilih Platform --</option>
                        <option value="PC">PC</option>
                        <option value="PlayStation">PlayStation</option>
                        <option value="Xbox">Xbox</option>
                        <option value="Switch">Switch</option>
                        <option value="Mobile">Mobile</option>
                    </select>
                </div>

                <div class="form-grup">
                    <label for="tahun">Tahun Rilis</label>
                    <input type="number" id="tahun" name="tahun" min="1990" max="2026">
                </div>

                <div class="form-grup">
                    <label for="rating">Rating (1-5)</label>
                    <input type="number" id="rating" name="rating" min="1" max="5" step="0.5">
                </div>

                <div class="form-grup">
                    <label for="deskripsi">Deskripsi</label>
                    <textarea id="deskripsi" name="deskripsi" rows="4"></textarea>
                </div>

                <div class="form-grup">
                    <button type="submit" class="btn-utama">Simpan</button>
                    <a class="btn-tutup" href="list.html">Batal</a>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 GameVault &mdash; ZhayaGTs</p>
    </footer>

    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/game.js"></script>
</body>
</html>
